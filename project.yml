name: UniDay
options:
  bundleIdPrefix: io.github.rowlanchik09
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "8.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
targets:
  UniDay:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rowlanchik09.UniDay
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/UniDay.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: UniDayWidget
        embed: true
  UniDayWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - path: App/Resources/legacy.js
        buildPhase: resources
      - path: App/Resources/runtime.js
        buildPhase: resources
      - path: App/Resources/widget-runtime.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rowlanchik09.UniDay.Widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/UniDayWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  UniDay:
    build:
      targets:
        UniDay: all
    run:
      config: Debug
